name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/knowledge/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type debt budget
        run: pnpm run lint:type-debt

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Knowledge service dependencies
        run: pip install -r server/knowledge/requirements.txt

      - name: Knowledge service tests
        env:
          KNOWLEDGE_PYTHON: python
        run: pnpm run knowledge:test

      - name: Production build
        run: pnpm run build
