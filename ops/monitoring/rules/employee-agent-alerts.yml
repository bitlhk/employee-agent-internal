groups:
  - name: employee-agent-slo-recording
    interval: 30s
    rules:
      - record: ea:slo_chat_success_ratio:30m
        expr: |
          (
            sum(rate(ea_chat_requests_total{outcome="success"}[30m]))
            /
            clamp_min(sum(rate(ea_chat_requests_total{outcome!="cancelled"}[30m])), 0.001)
          )
          and sum(rate(ea_chat_requests_total{outcome!="cancelled"}[30m])) > 0

      - record: ea:slo_mcp_success_ratio:30m
        expr: |
          (
            sum(rate(ea_mcp_calls_total{outcome=~"success|empty"}[30m]))
            /
            clamp_min(sum(rate(ea_mcp_calls_total{outcome!="cancelled"}[30m])), 0.001)
          )
          and sum(rate(ea_mcp_calls_total{outcome!="cancelled"}[30m])) > 0

      - record: ea:slo_knowledge_success_ratio:30m
        expr: |
          (
            sum(rate(ea_operational_activity_total{activity="knowledge_search",outcome=~"success|empty"}[30m]))
            /
            clamp_min(sum(rate(ea_operational_activity_total{activity="knowledge_search",outcome!="cancelled"}[30m])), 0.001)
          )
          and sum(rate(ea_operational_activity_total{activity="knowledge_search",outcome!="cancelled"}[30m])) > 0

      - record: ea:slo_chat_error_budget_burn:5m
        expr: |
          (
            1 -
            (
              sum(rate(ea_chat_requests_total{outcome="success"}[5m]))
              /
              clamp_min(sum(rate(ea_chat_requests_total{outcome!="cancelled"}[5m])), 0.001)
            )
          ) / 0.02
          and sum(rate(ea_chat_requests_total{outcome!="cancelled"}[5m])) > 0

      - record: ea:slo_chat_error_budget_burn:1h
        expr: |
          (
            1 -
            (
              sum(rate(ea_chat_requests_total{outcome="success"}[1h]))
              /
              clamp_min(sum(rate(ea_chat_requests_total{outcome!="cancelled"}[1h])), 0.001)
            )
          ) / 0.02
          and sum(rate(ea_chat_requests_total{outcome!="cancelled"}[1h])) > 0

      - record: ea:slo_mcp_error_budget_burn:5m
        expr: |
          (
            1 -
            (
              sum(rate(ea_mcp_calls_total{outcome=~"success|empty"}[5m]))
              /
              clamp_min(sum(rate(ea_mcp_calls_total{outcome!="cancelled"}[5m])), 0.001)
            )
          ) / 0.03
          and sum(rate(ea_mcp_calls_total{outcome!="cancelled"}[5m])) > 0

      - record: ea:slo_mcp_error_budget_burn:1h
        expr: |
          (
            1 -
            (
              sum(rate(ea_mcp_calls_total{outcome=~"success|empty"}[1h]))
              /
              clamp_min(sum(rate(ea_mcp_calls_total{outcome!="cancelled"}[1h])), 0.001)
            )
          ) / 0.03
          and sum(rate(ea_mcp_calls_total{outcome!="cancelled"}[1h])) > 0

      - record: ea:slo_knowledge_error_budget_burn:5m
        expr: |
          (
            1 -
            (
              sum(rate(ea_operational_activity_total{activity="knowledge_search",outcome=~"success|empty"}[5m]))
              /
              clamp_min(sum(rate(ea_operational_activity_total{activity="knowledge_search",outcome!="cancelled"}[5m])), 0.001)
            )
          ) / 0.01
          and sum(rate(ea_operational_activity_total{activity="knowledge_search",outcome!="cancelled"}[5m])) > 0

      - record: ea:slo_knowledge_error_budget_burn:1h
        expr: |
          (
            1 -
            (
              sum(rate(ea_operational_activity_total{activity="knowledge_search",outcome=~"success|empty"}[1h]))
              /
              clamp_min(sum(rate(ea_operational_activity_total{activity="knowledge_search",outcome!="cancelled"}[1h])), 0.001)
            )
          ) / 0.01
          and sum(rate(ea_operational_activity_total{activity="knowledge_search",outcome!="cancelled"}[1h])) > 0

      - record: ea:slo_chat_first_token_p95_seconds:10m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ea_chat_first_token_duration_seconds_bucket[10m]))
          )
          and sum(rate(ea_chat_first_token_duration_seconds_count[10m])) > 0

      - record: ea:slo_mcp_status_p95_seconds:10m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ea_http_request_duration_seconds_bucket{route="/api/claw/mcp-tools/status"}[10m]))
          )
          and sum(rate(ea_http_request_duration_seconds_count{route="/api/claw/mcp-tools/status"}[10m])) > 0

      - record: ea:slo_knowledge_search_p95_seconds:10m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ea_operational_activity_duration_seconds_bucket{activity="knowledge_search"}[10m]))
          )
          and sum(rate(ea_operational_activity_duration_seconds_count{activity="knowledge_search"}[10m])) > 0

  - name: employee-agent-availability
    rules:
      - alert: EmployeeAgentUnavailable
        expr: up{job="employee-agent"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Employee Agent metrics endpoint is unavailable
          description: Prometheus has been unable to scrape Employee Agent for more than two minutes.

      - alert: EmployeeAgentReadinessFailing
        expr: increase(ea_readiness_checks_total{outcome="failed"}[5m]) >= 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Employee Agent readiness checks are failing
          description: A required dependency has failed at least three readiness checks in five minutes.

      - alert: EmployeeAgentHighServerErrorRate
        expr: |
          (
            sum(rate(ea_http_requests_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(ea_http_requests_total[5m])), 0.001)
          ) > 0.05
          and sum(rate(ea_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent server error rate is elevated
          description: More than 5% of HTTP requests have returned 5xx responses for five minutes.

      - alert: EmployeeAgentSlowResponses
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ea_http_request_duration_seconds_bucket[10m]))
          ) > 5
          and sum(rate(ea_http_request_duration_seconds_count[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent HTTP p95 latency is elevated
          description: The aggregate HTTP p95 latency has exceeded five seconds for ten minutes.

  - name: employee-agent-capacity
    rules:
      - alert: EmployeeAgentLowDiskSpace
        expr: |
          ea_filesystem_size_bytes > 0
          and ea_filesystem_free_bytes / ea_filesystem_size_bytes < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent host filesystem is running low on space
          description: Less than 15% of the application filesystem remains available.

      - alert: EmployeeAgentHighResidentMemory
        expr: ea_process_resident_memory_bytes > 1073741824
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent process memory is elevated
          description: The Node.js process has used more than 1 GiB of resident memory for 15 minutes.

      - alert: EmployeeAgentExpertQueueSaturated
        expr: ea_operational_activity_active{activity="expert_task"} >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Expert task concurrency is elevated
          description: At least 20 expert tasks have remained active for ten minutes.

      - alert: EmployeeAgentCapacityLaneSaturated
        expr: |
          ea_capacity_limit > 0
          and ea_capacity_active / ea_capacity_limit >= 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent capacity lane is nearly full
          description: A bounded request lane has remained at or above 90% capacity for five minutes.

      - alert: EmployeeAgentCapacityRejectingRequests
        expr: increase(ea_capacity_rejections_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent is rejecting requests at its capacity guard
          description: At least one request was rejected by a bounded capacity lane in the last five minutes.

  - name: employee-agent-recovery
    rules:
      - alert: EmployeeAgentBackupStale
        expr: time() - ea_backup_last_success_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Employee Agent backup is stale or missing
          description: No successful local backup has been recorded within 26 hours.

      - alert: EmployeeAgentBackupValidationStale
        expr: time() - ea_backup_last_validation_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Employee Agent backup validation is stale or missing
          description: No checksum and decryption validation has passed within 26 hours.

      - alert: EmployeeAgentRestoreDrillStale
        expr: |
          ea_restore_drill_last_success_timestamp_seconds == 0
          or time() - ea_restore_drill_last_success_timestamp_seconds > 3024000
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent restore evidence is stale or missing
          description: No successful isolated restore drill has been recorded within 35 days.

      - alert: EmployeeAgentRestoreRpoExceeded
        expr: ea_restore_drill_rpo_seconds > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent restore RPO exceeded its objective
          description: The latest isolated restore drill used a snapshot older than 24 hours.

      - alert: EmployeeAgentRestoreRtoExceeded
        expr: ea_restore_drill_rto_seconds > 14400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent restore RTO exceeded its objective
          description: The latest isolated restore drill took longer than four hours.

      - alert: EmployeeAgentReleaseFailed
        expr: |
          ea_release_last_event_timestamp_seconds{action="deploy",result="failed"} > 0
          and time() - ea_release_last_event_timestamp_seconds{action="deploy",result="failed"} < 900
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Employee Agent release activation failed
          description: A release failed its activation or verification gate within the last 15 minutes.

  - name: employee-agent-workloads
    rules:
      - alert: EmployeeAgentChatErrorBudgetFastBurn
        expr: |
          ea:slo_chat_error_budget_burn:5m > 14.4
          and ea:slo_chat_error_budget_burn:1h > 14.4
          and sum(increase(ea_chat_requests_total{outcome!="cancelled"}[5m])) >= 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Employee Agent chat error budget is burning rapidly
          description: Chat failures are consuming the 30-day error budget at more than 14.4 times the sustainable rate.

      - alert: EmployeeAgentMcpErrorBudgetFastBurn
        expr: |
          ea:slo_mcp_error_budget_burn:5m > 14.4
          and ea:slo_mcp_error_budget_burn:1h > 14.4
          and sum(increase(ea_mcp_calls_total{outcome!="cancelled"}[5m])) >= 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Employee Agent MCP error budget is burning rapidly
          description: MCP failures are consuming the 30-day error budget at more than 14.4 times the sustainable rate.

      - alert: EmployeeAgentKnowledgeErrorBudgetFastBurn
        expr: |
          ea:slo_knowledge_error_budget_burn:5m > 14.4
          and ea:slo_knowledge_error_budget_burn:1h > 14.4
          and sum(increase(ea_operational_activity_total{activity="knowledge_search",outcome!="cancelled"}[5m])) >= 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Employee Agent knowledge error budget is burning rapidly
          description: Knowledge-search failures are consuming the 30-day error budget at more than 14.4 times the sustainable rate.

      - alert: EmployeeAgentChatSuccessSloMiss
        expr: |
          ea:slo_chat_success_ratio:30m < 0.98
          and sum(increase(ea_chat_requests_total{outcome!="cancelled"}[30m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent chat success SLO is below target
          description: Non-cancelled chat success has remained below 98% over the last 30 minutes.

      - alert: EmployeeAgentChatFirstTokenSlow
        expr: |
          histogram_quantile(
            0.95,
            sum by (runtime, le) (rate(ea_chat_first_token_duration_seconds_bucket[10m]))
          ) > 20
          and sum by (runtime) (rate(ea_chat_first_token_duration_seconds_count[10m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent chat first-token latency is elevated
          description: Chat p95 time to first visible token has exceeded 20 seconds for ten minutes.

      - alert: EmployeeAgentMcpStatusSlow
        expr: |
          ea:slo_mcp_status_p95_seconds:10m > 1.5
          and sum(increase(ea_http_request_duration_seconds_count{route="/api/claw/mcp-tools/status"}[10m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent MCP status query is slow
          description: MCP status p95 has exceeded 1.5 seconds with sufficient traffic.

      - alert: EmployeeAgentMcpCallsFailing
        expr: increase(ea_mcp_calls_total{outcome=~"error|timeout"}[15m]) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Multiple MCP tool calls have failed
          description: At least three MCP calls failed or timed out in the last 15 minutes.

      - alert: EmployeeAgentMcpSuccessSloMiss
        expr: |
          ea:slo_mcp_success_ratio:30m < 0.97
          and sum(increase(ea_mcp_calls_total{outcome!="cancelled"}[30m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent MCP success SLO is below target
          description: Non-cancelled MCP success has remained below 97% over the last 30 minutes.

      - alert: EmployeeAgentSandboxExecutionsFailing
        expr: increase(ea_sandbox_executions_total{outcome=~"error|timeout"}[15m]) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Multiple sandbox executions have failed
          description: At least three sandbox executions failed or timed out in the last 15 minutes.

      - alert: EmployeeAgentDatabasePoolQueued
        expr: increase(ea_db_pool_events_total{event="enqueue"}[5m]) >= 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent database pool is queuing work
          description: The database pool queued at least five connection requests in five minutes.

      - alert: EmployeeAgentBackgroundWorkerFailed
        expr: ea_background_worker_state{state="failed"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: An Employee Agent background worker failed
          description: A managed background worker has remained failed for two minutes.

      - alert: EmployeeAgentExpertTasksFailing
        expr: increase(ea_operational_activity_total{activity="expert_task",outcome=~"error|timeout"}[15m]) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Multiple expert tasks have failed
          description: At least three expert tasks failed or timed out in the last 15 minutes.

      - alert: EmployeeAgentKnowledgeIndexFailed
        expr: increase(ea_operational_activity_total{activity="knowledge_index",outcome="error"}[30m]) >= 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A knowledge indexing job failed
          description: At least one knowledge indexing job failed in the last 30 minutes.

      - alert: EmployeeAgentKnowledgeSearchSloMiss
        expr: |
          ea:slo_knowledge_success_ratio:30m < 0.99
          and sum(increase(ea_operational_activity_total{activity="knowledge_search",outcome!="cancelled"}[30m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent knowledge search SLO is below target
          description: Knowledge search success has remained below 99% over the last 30 minutes.

      - alert: EmployeeAgentKnowledgeSearchSlow
        expr: |
          ea:slo_knowledge_search_p95_seconds:10m > 2.5
          and sum(increase(ea_operational_activity_duration_seconds_count{activity="knowledge_search"}[10m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Employee Agent knowledge search is slow
          description: Knowledge search p95 has exceeded 2.5 seconds with sufficient traffic.
