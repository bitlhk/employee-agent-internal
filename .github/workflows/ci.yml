name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0.41
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: employee_agent_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/knowledge/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Empty database migration and idempotency
        env:
          DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/employee_agent_ci
          DATABASE_MIGRATION_URL: mysql://root:ci-root-password@127.0.0.1:3306/employee_agent_ci
        run: |
          pnpm db:deploy
          pnpm db:migrate:check
          pnpm db:deploy

      - name: Existing database baseline adoption
        env:
          DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/employee_agent_upgrade
          DATABASE_MIGRATION_URL: mysql://root:ci-root-password@127.0.0.1:3306/employee_agent_upgrade
        run: |
          node -e "require('mysql2/promise').createConnection('mysql://root:ci-root-password@127.0.0.1:3306/mysql').then(async c => { await c.query('CREATE DATABASE employee_agent_upgrade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'); await c.end(); })"
          pnpm exec drizzle-kit push --force
          pnpm db:migrate
          pnpm db:migrate:check

      - name: Reject incompatible existing database
        env:
          DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/employee_agent_incompatible
          DATABASE_MIGRATION_URL: mysql://root:ci-root-password@127.0.0.1:3306/employee_agent_incompatible
        run: |
          node -e "require('mysql2/promise').createConnection('mysql://root:ci-root-password@127.0.0.1:3306/mysql').then(async c => { await c.query('CREATE DATABASE employee_agent_incompatible CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'); await c.end(); })"
          pnpm exec drizzle-kit push --force
          node -e "require('mysql2/promise').createConnection(process.env.DATABASE_URL).then(async c => { await c.query('ALTER TABLE users DROP COLUMN name'); await c.end(); })"
          if pnpm db:migrate > /tmp/db-migrate-incompatible.log 2>&1; then
            echo "incompatible database was accepted" >&2
            exit 1
          fi
          grep -F "database does not match baseline-v1; missing users.name" /tmp/db-migrate-incompatible.log
          if pnpm db:baseline:repair > /tmp/db-repair-incompatible.log 2>&1; then
            echo "unsupported baseline drift was repaired" >&2
            exit 1
          fi
          grep -F "baseline repair refused unsupported drift: users.name" /tmp/db-repair-incompatible.log

      - name: Repair supported legacy database drift
        env:
          DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/employee_agent_legacy
          DATABASE_MIGRATION_URL: mysql://root:ci-root-password@127.0.0.1:3306/employee_agent_legacy
        run: |
          node -e "require('mysql2/promise').createConnection('mysql://root:ci-root-password@127.0.0.1:3306/mysql').then(async c => { await c.query('CREATE DATABASE employee_agent_legacy CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'); await c.end(); })"
          pnpm exec drizzle-kit push --force
          node -e "require('mysql2/promise').createConnection(process.env.DATABASE_URL).then(async c => { await c.query('ALTER TABLE lx_coop_user_hidden DROP COLUMN created_at'); await c.end(); })"
          pnpm db:baseline:repair
          pnpm db:migrate
          pnpm db:migrate:check

      - name: Release and rollback flow
        run: pnpm release:test

      - name: Lint
        run: pnpm run lint

      - name: Type debt budget
        run: pnpm run lint:type-debt

      - name: Module size budget
        run: pnpm run lint:module-size

      - name: Dependency policy
        run: pnpm run lint:dependencies

      - name: Production dependency audit
        run: pnpm run audit:dependencies

      - name: Typecheck
        run: pnpm run check

      - name: Test and coverage budget
        run: pnpm run test:coverage

      - name: Critical path coverage budget
        run: pnpm run test:coverage:critical

      - name: Governance and Role Pack database integration
        env:
          DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/employee_agent_ci
          RUN_DB_INTEGRATION_TESTS: "1"
        run: pnpm run test:integration:db

      - name: Load-test configuration safety
        run: pnpm run test:load-config

      - name: Knowledge service dependencies
        run: pip install -r server/knowledge/requirements.txt

      - name: Knowledge service tests
        env:
          KNOWLEDGE_PYTHON: python
        run: pnpm run knowledge:test

      - name: Production build
        run: pnpm run build
